services:
  # Backend API Service
  - type: web
    name: windlens-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ELEXON_BASE_URL
        value: https://data.elexon.co.uk/bmrs/api/v1

  # Frontend Static Site
  - type: static
    name: windlens-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://windlens-backend.onrender.com
